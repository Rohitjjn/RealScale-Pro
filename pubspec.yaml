name: realscale_pro
description: "RealScale-Pro — offline, on-device AI image upscaler. Private by default."
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: 3.4.3
  go_router: 18.1.2

  # UI
  dynamic_color: 1.9.0
  photo_view: 0.15.0
  smooth_page_indicator: 3.0.0
  flutter_native_splash: 2.4.8

  # Media & files
  photo_manager: 3.12.0
  image_picker: 1.2.4
  file_picker: 13.3.2
  image: 4.12.0

  # Platform services
  permission_handler: 13.0.2
  device_info_plus: 13.3.0
  path_provider: 2.1.6
  shared_preferences: 2.5.6
  share_plus: 13.3.1
  wakelock_plus: 1.8.2
  background_downloader: 9.6.5
  sqflite: 2.4.5
  sqflite_common_ffi: 2.4.5
  http: 1.6.0
  crypto: 3.0.8
  uuid: 4.6.0
  ffi: 2.2.0
  archive: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  # Test-only: platform stub for the SR flow's file picker.
  file_picker_platform_interface: ^4.2.0
  path_provider_platform_interface: 2.1.3
  plugin_platform_interface: 2.1.8
  # Test-only: Override type lives in this sub-library in Riverpod 3.
  riverpod: 3.4.3

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
  assets:
    - assets/brand/
    - assets/data/
    - assets/models_starter/
