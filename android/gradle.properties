# RealScale-Pro Gradle configuration.
#
# The heap is deliberately capped so builds also succeed on low-RAM
# developer machines (the reference build env has 3.9 GB RAM / 2 cores).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# These flags were added by the Flutter template
android.newDsl=false
android.builtInKotlin=false
