# RealScale-Pro Gradle configuration.
#
# This build compiles the Dart AOT snapshot AND the native engine
# (CMake/NDK) for three ABIs in one Gradle invocation. A 2 GB heap is not
# enough for that (the Kotlin/AGP side alone peaks above it once the NDK
# configuration for several ABIs is in play), so the heap is 4 GB with a
# bounded metaspace and an explicit UTF-8 encoding (keeps resource names and
# Kotlin sources identical across machines).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# No daemon: CI runs one build per job, and a stale daemon holding 4 GB is
# worse than the ~20 s it costs to start one.
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# These flags were added by the Flutter template
android.newDsl=false
android.builtInKotlin=false
