# RealScale-Pro — verify, then build installable Android APKs.
#
# Two independent jobs:
#   1. `verify`      — format, analyze, Dart tests, native unit tests, and a
#                      REAL inference run on the committed model fixture.
#   2. `android-apk` — the release APK (universal + one per ABI) with the ncnn
#                      engine compiled in, verified by unzip + apksigner.
#
# Everything is fetched by the workflow; no local Flutter/Android SDK needed.
#
#   Actions → "Android release APK" → Run workflow → download the
#   `realscale-pro-release-apk-<run>` artifact → `adb install -r <file>.apk`
#
# Signing: put the base64 of an `android/key.properties` file into the
# KEY_PROPERTIES repository secret to sign with a real upload key. Without it
# the APK is signed with the debug certificate — a full release build (AOT
# Dart + native ncnn) that installs on any phone, just not store-ready.
name: Android release APK

on:
  workflow_dispatch:
    inputs:
      split_per_abi:
        description: 'Also build one smaller APK per CPU architecture'
        type: boolean
        default: true
      include_native_ncnn:
        description: 'Compile the ncnn inference engine into the APK'
        type: boolean
        default: true
  push:
    # 'arena/**' keeps the agent's working branch building on every push, so
    # the APK stays downloadable without opening a pull request.
    branches: ['main', 'arena/**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the Flutter SDK the project was generated with (see .metadata
  # and the `flutter: >=3.47.0` constraint in pubspec.lock).
  FLUTTER_VERSION: '3.47.9'
  # AGP 9.1 / Gradle 9.3.1 in this project require a modern JDK.
  JAVA_VERSION: '21'
  # ncnn prebuilts are cached outside the checkout so Gradle never sees them
  # as project inputs (see the "Fetch ncnn" step).
  RS_THIRD_PARTY_DIR: ${{ github.workspace }}/../third_party

jobs:
  # ---------------------------------------------------------------------------
  # 1. Quality gates + a real run of the native engine.
  # ---------------------------------------------------------------------------
  verify:
    name: Analyze, format & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      # Advisory: reports the diff but never blocks the APK. Run
      # `dart format .` locally to clear it.
      - name: Check formatting (advisory)
        continue-on-error: true
        run: |
          set +e
          dart format . > format.log 2>&1
          if git diff --quiet; then
            echo "dart format: clean"
            exit 0
          fi
          echo "::warning title=dart format::files need formatting — run \`dart format .\`"
          git --no-pager diff --stat
          for f in $(git --no-pager diff --name-only); do
            echo "::warning file=$f::needs dart format"
          done

      - name: Analyze (must report zero issues)
        run: |
          set +e
          flutter analyze --fatal-warnings 2>&1 | tee analyze.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            echo "flutter analyze: clean"
            exit 0
          fi
          grep -E '(info|warning|error) • ' analyze.log | head -n 80 \
            | while IFS= read -r line; do echo "::error file=analyze::$line"; done
          exit 1

      # --- native engine: build the host shim, run unit + REAL inference -----
      - name: Cache host ncnn build
        id: ncnn-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.RS_THIRD_PARTY_DIR }}
          key: ncnn-host-${{ runner.os }}-${{ hashFiles('tools/fetch_ncnn.sh') }}
          restore-keys: |
            ncnn-host-${{ runner.os }}-

      - name: Fetch pinned ncnn source + stb headers
        run: |
          bash tools/fetch_ncnn.sh linux
          bash tools/fetch_ncnn.sh stb

      - name: Build native engine + tests (host)
        run: cmake --version && bash tools/build_native.sh

      - name: Native unit tests (tile layout + feather blend)
        run: |
          set -euo pipefail
          B="${{ env.RS_THIRD_PARTY_DIR }}/rs-host-build"
          "$B/test_tile_layout"
          "$B/test_feather_blend"

      - name: Native REAL inference test (committed model fixture)
        run: |
          set -euo pipefail
          B="${{ env.RS_THIRD_PARTY_DIR }}/rs-host-build"
          export RS_TEST_MODEL_PARAM="$PWD/test/fixtures/models/realesr-animevideov3-x4.param"
          export RS_TEST_MODEL_BIN="$PWD/test/fixtures/models/realesr-animevideov3-x4.bin"
          export RS_TEST_MODEL_SCALE=4
          # Recovery path: the test build injects bad_alloc on the first tiles.
          export RS_TEST_FAIL_TILES=2
          "$B/test_engine" 2>&1 | tee native-test.log
          grep -q '^\[PASS\] engine_real_inference_full_pipeline' native-test.log

      - name: Native CLI end-to-end (real upscale, real output file)
        run: |
          set -euo pipefail
          B="${{ env.RS_THIRD_PARTY_DIR }}/rs-host-build"
          M=test/fixtures/models
          "$B/rscli" --param "$M/realesr-animevideov3-x4.param" \
            --bin "$M/realesr-animevideov3-x4.bin" \
            --in test/fixtures/input.jpg --out /tmp/rs-out.png \
            --scale 4 --tile 96 --overlap 10 --context 2 --threads 2
          python3 - <<'PY'
          import struct, sys
          data = open('/tmp/rs-out.png', 'rb').read()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'not a PNG'
          w, h = struct.unpack('>II', data[16:24])
          assert (w, h) == (880, 880), f'unexpected output size {w}x{h}'
          print(f'rscli produced a real 880x880 upscale ({len(data)} bytes)')
          PY

      - name: Run Dart tests (includes REAL FFI inference)
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            echo "flutter test: all green"
            grep -E 'All tests passed|~[0-9]+ skipped' test.log || true
            exit 0
          fi
          grep -nE '\[E\]|EXCEPTION|Expected:|  Actual:|TestFailure|Some tests failed|TimeoutException' test.log \
            | tail -n 60 | while IFS= read -r line; do echo "::error file=test::$line"; done
          exit 1

      # A skipped inference test must not silently pass: fail if the REAL
      # native tests were skipped (the fixture .so is built two steps above).
      - name: Assert the real-inference tests actually ran
        run: |
          set -euo pipefail
          if grep -q 'native FFI + REAL inference.*skipped' test.log; then
            echo "::error file=test::REAL inference tests were SKIPPED"
            exit 1
          fi
          echo "real-inference tests ran against build/native/librealscale_native.so"

  # ---------------------------------------------------------------------------
  # 2. The release APK.
  # ---------------------------------------------------------------------------
  android-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Deliberately independent from `verify`: a failing Dart test must not
    # hide the APK build result, and a broken APK must not be masked by green
    # tests. Both jobs are reported separately.
    env:
      # Gradle's heap is configured in android/gradle.properties.
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: |
          yes | flutter doctor --android-licenses >/dev/null 2>&1 || true
          flutter doctor --android-licenses 2>&1 | tail -n 3 || true
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Restore the signing keystore (optional)
        env:
          KEY_PROPERTIES_B64: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -n "${KEY_PROPERTIES_B64:-}" ]; then
            printf '%s' "$KEY_PROPERTIES_B64" | base64 -d > android/key.properties
            echo "key.properties restored — release APK will be signed with the upload key"
          else
            echo "No KEY_PROPERTIES secret — release APK falls back to the debug certificate"
          fi

      - name: Cache ncnn Android prebuilts
        id: ncnn-android-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.RS_THIRD_PARTY_DIR }}/ncnn-android
          key: ncnn-android-20250503-${{ runner.os }}

      - name: Fetch pinned ncnn prebuilts for Android
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_native_ncnn }}
        run: |
          bash tools/fetch_ncnn.sh android
          for abi in arm64-v8a armeabi-v7a x86_64; do
            ls -l "$RS_THIRD_PARTY_DIR/ncnn-android/$abi/lib/libncnn.a"
          done

      # Gradle swaps in the engine's own .so; a stale NDK cache from an older
      # commit would be silently reused without this.
      - name: Clean stale native build state
        run: rm -rf build android/app/.cxx

      # Gradle reads the same RS_THIRD_PARTY_DIR, so both sides must see the
      # prebuilts. Verifying it here turns a silent stub build into a loud one.
      - name: Configure the native engine
        run: |
          set -euo pipefail
          echo "RS_THIRD_PARTY_DIR=$RS_THIRD_PARTY_DIR"
          if [ "${{ github.event_name != 'workflow_dispatch' || inputs.include_native_ncnn }}" = "false" ]; then
            echo "::warning title=Native engine::include_native_ncnn=false — interface-only engine will be shipped"
            exit 0
          fi
          missing=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "$RS_THIRD_PARTY_DIR/ncnn-android/$abi/lib/libncnn.a" ]; then
              echo "ncnn $abi: $(du -h "$RS_THIRD_PARTY_DIR/ncnn-android/$abi/lib/libncnn.a" | cut -f1)"
            else
              echo "::error::ncnn prebuilt for $abi is missing at $RS_THIRD_PARTY_DIR/ncnn-android/$abi/lib/libncnn.a"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build universal release APK
        run: |
          set +e
          flutter build apk --release 2>&1 | tee build-universal.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -nE '^\s*e: |error:|Unresolved|Caused by:|Execution failed|CMake Error|FAILED:|ninja: build stopped|ld: |undefined reference' build-universal.log \
              | head -n 40 | while IFS= read -r line; do echo "::error file=android::$line"; done
            grep -n -A 15 'CMake Error' build-universal.log | head -n 60 \
              | while IFS= read -r line; do echo "::error file=native/CMakeLists.txt::$line"; done
            exit 1
          fi

      - name: Build per-ABI release APKs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.split_per_abi }}
        run: |
          set +e
          flutter build apk --release --split-per-abi 2>&1 | tee build-abi.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -nE '^\s*e: |error:|Unresolved|Caused by:|Execution failed|CMake Error|FAILED:|ninja: build stopped|ld: |undefined reference' build-abi.log \
              | head -n 40 | while IFS= read -r line; do echo "::error file=android::$line"; done
            exit 1
          fi

      - name: Verify the APK contents
        run: |
          set -euo pipefail
          APK_DIR=build/app/outputs/flutter-apk
          ls -la "$APK_DIR"
          mapfile -t APKS < <(find "$APK_DIR" -name '*.apk' | sort)
          [ "${#APKS[@]}" -gt 0 ] || { echo "::error::No APK produced"; exit 1; }
          SHIPPED=0
          for apk in "${APKS[@]}"; do
            echo "=== $(basename "$apk") ==="
            # A release build is AOT compiled: every ABI must ship libapp.so
            # (debug builds carry a kernel blob instead).
            unzip -l "$apk" | grep -E 'lib/[^/]+/libapp\.so' \
              || { echo "::error file=$apk::missing libapp.so"; exit 1; }
            unzip -l "$apk" | grep -E 'lib/[^/]+/librealscale_native\.so' \
              || { echo "::error file=$apk::missing librealscale_native.so"; exit 1; }
            # The engine must be the REAL one (it embeds the ncnn backend
            # name only when compiled against ncnn).
            if unzip -p "$apk" 'lib/arm64-v8a/librealscale_native.so' 2>/dev/null | strings | grep -q 'ncnn-cpu'; then
              echo "arm64-v8a engine: ncnn backend present"
              SHIPPED=1
            fi
            echo "--- ABIs ---"
            unzip -l "$apk" | awk '{print $4}' | grep -E '^lib/[^/]+/' | cut -d/ -f2 | sort -u
          done
          if [ -f "$RS_THIRD_PARTY_DIR/ncnn-android/arm64-v8a/lib/libncnn.a" ] && [ "$SHIPPED" -ne 1 ]; then
            echo "::error::ncnn was fetched but the APK engine has no ncnn backend"
            exit 1
          fi

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found"; exit 1; }
          echo "using $APKSIGNER"
          for apk in $(find build/app/outputs/flutter-apk -name '*.apk' | sort); do
            "$APKSIGNER" verify --print-certs "$apk" | head -n 4
          done

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-out
          find build/app/outputs/flutter-apk -name '*.apk' -exec cp {} release-out/ \;
          cd release-out
          # Stable, self-describing names: app-release.apk -> realscale-pro-1.0.0.apk
          VERSION="$(grep -m1 '^version:' ../pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)"
          for f in *.apk; do
            case "$f" in
              *arm64-v8a*) suffix=arm64-v8a ;;
              *armeabi-v7a*) suffix=armeabi-v7a ;;
              *x86_64*) suffix=x86_64 ;;
              *) suffix=universal ;;
            esac
            mv "$f" "realscale-pro-${VERSION}-${suffix}.apk"
          done
          {
            echo "# RealScale-Pro — release Android APK"
            echo
            echo "version : ${VERSION}"
            echo "flutter : ${{ env.FLUTTER_VERSION }}"
            echo "commit  : ${{ github.sha }}"
            echo "run     : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Install with: adb install -r realscale-pro-${VERSION}-<abi>.apk"
            echo "(use the arm64-v8a APK for modern phones, universal if unsure)"
            echo
            sha256sum ./*.apk
          } > README-APK.txt
          ls -la
          cat README-APK.txt

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: realscale-pro-release-apk-${{ github.run_number }}
          path: release-out/
          if-no-files-found: error
          retention-days: 30
