# RealScale-Pro — release Android APK for real-device testing.
#
# This workflow builds a RELEASE APK (never a debug APK) that can be
# installed straight onto a phone. Everything it needs is fetched here, so
# no local Flutter/Android SDK is required.
#
#   Actions tab → "Android release APK" → Run workflow → download the
#   `realscale-pro-release-apk-<run>` artifact → install the .apk.
#
# Signing: put the base64 of a `key.properties` file into the
# KEY_PROPERTIES repository secret to sign with the real upload key.
# Without it the build falls back to the auto-generated certificate —
# still a release build (AOT + R8), just not store-ready.
name: Android release APK

on:
  workflow_dispatch:
    inputs:
      split_per_abi:
        description: 'Also build one smaller APK per CPU architecture'
        type: boolean
        default: true
      include_native_ncnn:
        description: 'Build the native ncnn engine (model support)'
        type: boolean
        default: true
  push:
    # 'arena/**' keeps the agent's working branch building on every push, so
    # the release APK is always downloadable without opening a pull request.
    branches: ['main', 'arena/**']
    paths-ignore: ['**.md', 'docs/**', 'reports/**', 'ci-reports/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  JAVA_VERSION: '21'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Quality gates + a real run of the native engine on all starter models.
  # ---------------------------------------------------------------------------
  verify:
    name: Analyze, format & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # Formatting gate: prints the exact `dart format` diff when the tree is
      # not clean, so the fix is a copy/paste away.
      - name: Check formatting (dart format must be clean)
        run: |
          set +e
          dart format .
          if git diff --quiet; then
            echo "dart format: clean"
            exit 0
          fi
          git --no-pager diff > format.diff
          git --no-pager diff --stat
          # One annotation per file so nothing gets truncated.
          for f in $(git --no-pager diff --name-only); do
            d=$(git --no-pager diff -- "$f" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error file=$f::$d"
          done
          exit 1

      - name: Analyze (must report zero issues)
        run: |
          set +e
          flutter analyze --fatal-warnings 2>&1 | tee analyze.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            echo "flutter analyze: clean"
            exit 0
          fi
          # One annotation per finding so the whole list is readable.
          # Analyzer lines look like: "  warning • message • path:line:col • code"
          grep -E '(info|warning|error|lint) • ' analyze.log \
            | head -n 60 | while IFS= read -r line; do
              echo "::error file=analyze::$line"
            done
          tail -n 40 analyze.log | while IFS= read -r line; do
            echo "::error file=analyze::TAIL $line"
          done
          exit 1

      - name: Run tests
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            echo "flutter test: all green"
            exit 0
          fi
          # The interesting detail is always in the tail: the failing test,
          # the thrown exception and the Expected/Actual lines.
          tail -n 140 test.log | while IFS= read -r line; do
            echo "::error file=test::$line"
          done
          exit 1

      # --- native engine: build the Linux shim and run a REAL upscale ---------
      - name: Fetch pinned ncnn (BSD-3-Clause) for Linux
        run: bash native/fetch_ncnn.sh linux

      - name: Configure native build
        run: >
          cmake -S native -B native/build/linux
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SMOKE_TEST=ON
          -DENABLE_VULKAN=OFF

      - name: Build native shim + smoke test
        run: cmake --build native/build/linux --config Release -j 4

      - name: Run native smoke test on all four starter models
        run: |
          set +e
          export LD_LIBRARY_PATH="$PWD/native/third_party/ncnn-linux/lib:$LD_LIBRARY_PATH"
          ./native/build/linux/realscale_ncnn_smoke "$PWD" 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            echo "native smoke test: all four starter models upscaled"
            exit 0
          fi
          message=$(tail -n 60 smoke.log | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error file=native::$message"
          exit 1

  # ---------------------------------------------------------------------------
  # 2. The release APK itself.
  # ---------------------------------------------------------------------------
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Optional: set the KEY_PROPERTIES repository secret to the base64 of a
      # `key.properties` file to sign with the real upload key. Without it the
      # build falls back to the auto-generated certificate: still a release
      # build (AOT + R8), just not store-ready.
      - name: Restore the signing keystore (optional)
        env:
          KEY_PROPERTIES_B64: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -n "${KEY_PROPERTIES_B64:-}" ]; then
            printf '%s' "$KEY_PROPERTIES_B64" | base64 -d > android/key.properties
            echo "key.properties restored (release signing)"
          else
            echo "No upload keystore configured — using the fallback certificate"
          fi

      # ncnn must be on disk BEFORE the Gradle configure step so
      # android/app/build.gradle.kts wires in the CMake native build. If the
      # download is ever unavailable the APK still builds — it then ships
      # with the honest pure-Dart Lanczos engine only.
      - name: Fetch pinned ncnn (BSD-3-Clause) for Android
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_native_ncnn }}
        continue-on-error: true
        run: bash native/fetch_ncnn.sh android

      - name: Build universal release APK
        run: |
          set +e
          flutter build apk --release 2>&1 | tee build-universal.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            message=$(tail -n 80 build-universal.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error file=android::$message"
            exit 1
          fi

      - name: Build per-ABI release APKs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.split_per_abi }}
        run: |
          set +e
          flutter build apk --release --split-per-abi 2>&1 | tee build-abi.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            message=$(tail -n 80 build-abi.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error file=android::$message"
            exit 1
          fi

      - name: Verify the APK contents
        run: |
          set -euo pipefail
          APK_DIR="build/app/outputs/flutter-apk"
          ls -la "$APK_DIR"
          mapfile -t APKS < <(find "$APK_DIR" -name '*.apk' | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No release APK was produced"
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            echo "=== $apk ==="
            # A release build is AOT compiled: every ABI must ship
            # libapp.so (debug builds carry kernel blob files instead).
            unzip -l "$apk" | grep -E 'lib/[^/]+/libapp\.so' \
              || { echo "::error::$apk is missing libapp.so"; exit 1; }
            echo "libapp.so: OK"
            if [ -d native/third_party/ncnn-android ]; then
              unzip -l "$apk" | grep -E 'lib/[^/]+/librealscale_ncnn\.so' \
                || { echo "::error::$apk is missing librealscale_ncnn.so"; exit 1; }
              echo "librealscale_ncnn.so: OK"
            else
              echo "native ncnn not fetched — APK ships Lanczos fallback only"
            fi
          done

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using $APKSIGNER"
          APK_DIR="build/app/outputs/flutter-apk"
          mapfile -t APKS < <(find "$APK_DIR" -name '*.apk' | sort)
          for apk in "${APKS[@]}"; do
            "$APKSIGNER" verify --print-certs "$apk" \
              || { echo "::error::$apk failed signature verification"; exit 1; }
          done

      - name: Collect release artifacts
        run: |
          mkdir -p release-out
          find build/app/outputs/flutter-apk -name '*.apk' -exec cp {} release-out/ \;
          {
            echo "# RealScale-Pro — release Android APK"
            echo
            echo "App version : $(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2)"
            echo "Flutter     : ${{ env.FLUTTER_VERSION }}"
            echo "Commit      : ${{ github.sha }}"
            echo "Run         : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Install with: adb install -r <file>.apk"
          } > release-out/README-APK.txt
          ls -la release-out

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: realscale-pro-release-apk-${{ github.run_number }}
          path: release-out/
          if-no-files-found: error
          retention-days: 30
