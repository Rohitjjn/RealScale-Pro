name: Model facts

# Joins the two authoritative sources of model truth:
#   1. the upstream assets archive (what actually has to sit on disk for the engine to run), and
#   2. the Hugging Face API tree for tumuyan2/realsr-models (download paths, byte sizes and, for
#      LFS files, the SHA-256 the downloader must verify).
# The result is relayed to the CI bridge issue because the agent sandbox cannot read Actions logs
# or artifacts (blob storage is egress-blocked).
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/model-facts.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: model-facts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the upstream assets archive (models + engines, 1.13.0)
        run: |
          curl -fL --retry 3 -o /tmp/assets.zip \
            https://github.com/tumuyan/RealSR-NCNN-Android/releases/download/1.13.0/assets.zip
          ls -l /tmp/assets.zip
          mkdir -p /tmp/assets
          unzip -q /tmp/assets.zip -d /tmp/assets

      - name: Fetch the Hugging Face model tree (paths, sizes, LFS sha256)
        run: |
          curl -fsSL --retry 3 \
            "https://huggingface.co/api/models/tumuyan2/realsr-models/tree/main?recursive=true" \
            -o /tmp/hf-tree.json
          python3 -c "import json;d=json.load(open('/tmp/hf-tree.json'));print(len(d),'entries');print([e['path'] for e in d[:5]])"

      - name: Join local assets with the remote tree
        run: |
          python3 - <<'PY'
          import hashlib, json, os

          # 1. Local facts: what the engine needs on disk.
          MODEL_DIRS = [
              "models-Real-ESRGAN", "models-Real-ESRGAN-anime",
              "models-Real-ESRGANv2-anime", "models-Real-ESRGANv3-anime",
              "models-Real-ESRGANv3-general", "models-Real-ESRGAN-SourceBook",
              "models-ESRGAN-Nomos8kSC", "models-MNN/ESRGAN-Nomos8kSC-x4.mnn",
              "models-MNN/ESRGAN-MoeSR-jp_Illustration-x4.mnn",
              "models-se", "models-pro", "models-nose",
          ]
          roots = []
          for base, dirs, files in os.walk("/tmp/assets"):
              if os.path.basename(base) == "realsr" or any(d.startswith("models-") for d in dirs):
                  roots.append(base)
          roots = sorted(set(roots), key=len)

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          local = {}
          for target in MODEL_DIRS:
              for root in roots:
                  cand = os.path.join(root, target)
                  if not os.path.exists(cand):
                      continue
                  files = []
                  if os.path.isdir(cand):
                      for name in sorted(os.listdir(cand)):
                          path = os.path.join(cand, name)
                          if os.path.isfile(path):
                              files.append({"fileName": name, "sizeBytes": os.path.getsize(path), "sha256": sha256(path)})
                  else:
                      files.append({"fileName": os.path.basename(cand), "sizeBytes": os.path.getsize(cand), "sha256": sha256(cand)})
                  local[target] = {"totalBytes": sum(f["sizeBytes"] for f in files), "files": files}
                  break

          # 2. Remote facts from the HF tree (LFS entries carry the sha256 in `lfs.oid`).
          tree = json.load(open("/tmp/hf-tree.json"))
          remote = {}
          for entry in tree:
              if entry.get("type") != "file":
                  continue
              path = entry["path"]
              sha = (entry.get("lfs") or {}).get("oid")
              size = (entry.get("lfs") or {}).get("size") or entry.get("size")
              remote[path] = {"sizeBytes": size, "sha256": sha}

          # 3. Join: for every needed file, find the remote path with the same file name and size.
          by_name_size = {}
          for path, meta in remote.items():
              by_name_size.setdefault((os.path.basename(path), meta["sizeBytes"]), []).append(path)

          joined = {}
          for dirname, info in local.items():
              files = []
              for f in info["files"]:
                  candidates = by_name_size.get((f["fileName"], f["sizeBytes"]), [])
                  # Prefer the candidate whose directory matches the needed one, then any.
                  best = next((c for c in candidates if dirname in c or c.startswith(dirname)), candidates[0] if candidates else None)
                  files.append({
                      "fileName": f["fileName"],
                      "sizeBytes": f["sizeBytes"],
                      "sha256Local": f["sha256"],
                      "remotePath": best,
                      "sha256Remote": remote[best]["sha256"] if best else None,
                      "match": bool(best) and remote[best]["sha256"] in (None, f["sha256"]),
                  })
              joined[dirname] = {"totalBytes": info["totalBytes"], "files": files}

          unmatched = [p for p in remote if not any(f["remotePath"] == p for d in joined.values() for f in d["files"])]
          out = {
              "hfRepo": "tumuyan2/realsr-models",
              "hfRevision": "main",
              "localModelDirs": joined,
              "remoteFileCount": len(remote),
              "remoteFiles": remote,
              "unmappedRemoteDirs": sorted({p.split('/')[0] for p in unmatched})[:60],
          }
          json.dump(out, open("model-facts.json", "w"), indent=1, sort_keys=True)

          for d, info in joined.items():
              ok = sum(1 for f in info["files"] if f["remotePath"])
              print(f"{d:58s} {info['totalBytes']/1048576:7.2f} MB  mapped {ok}/{len(info['files'])}  dirs seen: {len(remote)}")
          print("remote top-level dirs:", sorted({p.split('/')[0] for p in remote}))
          PY

      - name: Relay the facts to the CI bridge issue
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          facts = json.load(open("model-facts.json"))
          body = "### model-facts\n```json\n" + json.dumps(facts, indent=1, sort_keys=True) + "\n```"
          issue = 10
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{issue}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json", "User-Agent": "realscale-ci"},
              method="POST")
          with urllib.request.urlopen(req, timeout=60) as r:
              print("relayed", r.status)
          PY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
