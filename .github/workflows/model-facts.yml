name: Model facts

# Joins the two authoritative sources of model truth:
#   1. the upstream assets archive (what actually has to sit on disk for the engine to run), and
#   2. the Hugging Face API tree for tumuyan2/realsr-models (download paths, byte sizes and, for
#      LFS files, the SHA-256 the downloader must verify).
# The result is relayed to the CI bridge issue because the agent sandbox cannot read Actions logs
# or artifacts (blob storage is egress-blocked).
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/model-facts.yml'
      - '.github/scripts/model-facts.py'

permissions:
  contents: read
  issues: write

concurrency:
  group: model-facts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the upstream assets archive (models + engines, 1.13.0)
        run: |
          curl -fL --retry 3 -o /tmp/assets.zip \
            https://github.com/tumuyan/RealSR-NCNN-Android/releases/download/1.13.0/assets.zip
          ls -l /tmp/assets.zip
          mkdir -p /tmp/assets
          unzip -q /tmp/assets.zip -d /tmp/assets

      - name: Fetch the Hugging Face model tree (paths, sizes, LFS sha256)
        run: |
          curl -fsSL --retry 3 \
            "https://huggingface.co/api/models/tumuyan2/realsr-models/tree/main?recursive=true" \
            -o /tmp/hf-tree.json
          python3 -c "import json;d=json.load(open('/tmp/hf-tree.json'));print(len(d),'entries');print([e['path'] for e in d[:5]])"

      - name: Join local assets with the remote tree
        run: |
          python3 .github/scripts/model-facts.py

      - name: Relay the facts to the CI bridge issue
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          facts = json.load(open("model-facts.json"))
          body = "### model-facts\n```json\n" + json.dumps(facts, indent=1, sort_keys=True) + "\n```"
          issue = 10
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{issue}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json", "User-Agent": "realscale-ci"},
              method="POST")
          with urllib.request.urlopen(req, timeout=60) as r:
              print("relayed", r.status)
          PY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
