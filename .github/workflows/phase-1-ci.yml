name: Phase 1 verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  quality:
    name: Analyze and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve pinned packages
        shell: bash
        run: |
          if ! flutter pub get 2>&1 | tee pub-get.log; then
            message=$(tail -n 20 pub-get.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error file=pubspec.yaml::$message"
            exit 1
          fi
      - name: Generate English localization
        run: flutter gen-l10n
      - name: Export one-off formatter result
        shell: bash
        run: |
          dart format lib test
          for file in $(git diff --name-only -- lib test); do
            encoded=$(base64 -w 0 "$file")
            echo "::error file=$file::$encoded"
          done
          git diff --quiet -- lib test
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze without warnings
        shell: bash
        run: |
          if ! flutter analyze --fatal-infos --fatal-warnings 2>&1 | tee analyze.log; then
            message=$(tail -n 80 analyze.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error file=lib::$message"
            exit 1
          fi
      - name: Run unit and widget tests
        run: flutter test --reporter expanded
      - name: Run portable policy checks
        shell: bash
        run: |
          node --check preview/app.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in (
              'lib/l10n/app_en.arb',
              'assets/data/planner_rules.json',
              'assets/data/starter_manifest.json',
          ):
              json.loads(Path(path).read_text())
          print('Portable policy checks passed.')
          PY
          if git grep -E 'video_player|pickVideo|VideoPlayer|ffmpeg|READ_MEDIA_VIDEO' -- \
            ':!Docs/**' ':!reports/**' ':!.github/**'; then
            echo 'Forbidden future-media implementation found.' >&2
            exit 1
          fi

  native-engine:
    name: Native ncnn CPU proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure native spike
        run: cmake -S native/spike -B build/spike -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build native spike
        run: cmake --build build/spike --config Release --parallel 2
      - name: Run a real model
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          width = height = 64
          with Path('build/input.ppm').open('wb') as output:
              output.write(f'P6\n{width} {height}\n255\n'.encode())
              for y in range(height):
                  for x in range(width):
                      output.write(bytes((x * 4, y * 4, (x + y) * 2)))
          PY
          build/spike/realscale_ncnn_spike \
            assets/models_starter/scale2.0x_model.param \
            assets/models_starter/scale2.0x_model.bin \
            build/input.ppm build/output.ppm | tee build/native-result.txt
          grep -q 'output=128x128' build/native-result.txt
          test "$(wc -c < build/output.ppm)" -eq 49167

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve pinned packages
        run: flutter pub get
      - name: Build Android arm64 app
        shell: bash
        run: |
          if ! flutter build apk --debug --target-platform android-arm64 2>&1 | tee android-build.log; then
            message=$(tail -n 100 android-build.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error file=android::$message"
            exit 1
          fi
      - name: Upload Android test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RealScale-Pro-Android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows debug build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Resolve pinned packages
        run: flutter pub get
      - name: Build Windows app
        shell: bash
        run: |
          if ! flutter build windows --debug 2>&1 | tee windows-build.log; then
            tail -n 20 windows-build.log > windows-errors.log
            message=$(sed ':a;N;$!ba;s/\n/%0A/g' windows-errors.log)
            echo "::error file=windows::$message"
            exit 1
          fi
      - name: Upload Windows test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RealScale-Pro-Windows-debug
          path: build/windows/x64/runner/Debug/
          if-no-files-found: error
          retention-days: 14
