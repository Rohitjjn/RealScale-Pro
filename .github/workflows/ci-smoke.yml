name: ci-smoke

on:
  push:
    branches: ['main', 'arena/**']

env:
  FLUTTER_VERSION: '3.47.9'
  JAVA_VERSION: '21'
  NCNN_VERSION: '20240410'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Quality gates + a real run of the native engine on all starter models.
  # ---------------------------------------------------------------------------
  verify:
    name: Analyze, format & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      # Formatting gate. It prints the exact `dart format` diff when the tree
      # is not clean, so the fix is a one-command copy/paste.
      - name: Check formatting (dart format must be clean)
        id: format
        continue-on-error: true
        run: |
          dart format .
          if ! git diff --quiet; then
            echo "::error::dart format changed files — run 'dart format .' and commit"
            git --no-pager diff
            exit 1
          fi
          echo "dart format: clean"

      - name: Analyze (must report zero issues)
        run: flutter analyze --fatal-warnings

      - name: Run tests
        run: flutter test --reporter expanded

      # --- native engine: build the Linux shim and run a REAL upscale ---------
      - name: Fetch pinned ncnn (BSD-3-Clause) for Linux
        run: bash native/fetch_ncnn.sh linux

      - name: Configure native build
        run: >
          cmake -S native -B native/build/linux
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SMOKE_TEST=ON
          -DENABLE_VULKAN=OFF

      - name: Build native shim + smoke test
        run: cmake --build native/build/linux --config Release -j 4

      - name: Run native smoke test on all four starter models
        run: |
          export LD_LIBRARY_PATH="$PWD/native/third_party/ncnn-linux/lib:$LD_LIBRARY_PATH"
          ./native/build/linux/realscale_ncnn_smoke "$PWD"

  # ---------------------------------------------------------------------------
  # 2. The release APK itself.
  # ---------------------------------------------------------------------------
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore the signing keystore (optional)
        if: ${{ secrets.KEY_PROPERTIES != '' }}
        run: |
          printf '%s' "${{ secrets.KEY_PROPERTIES }}" | base64 -d > android/key.properties
          echo "key.properties restored"

      # ncnn must be on disk BEFORE the Gradle configure step so
      # android/app/build.gradle.kts wires in the CMake native build. If the
      # download is ever unavailable the APK still builds — it then ships
      # with the honest pure-Dart Lanczos engine only.
      - name: Fetch pinned ncnn (BSD-3-Clause) for Android
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_native_ncnn }}
        continue-on-error: true
        id: ncnn
        run: bash native/fetch_ncnn.sh android

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Build per-ABI release APKs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.split_per_abi }}
        run: flutter build apk --release --split-per-abi

      - name: Verify the APK contents
        run: |
          set -euo pipefail
          APK_DIR="build/app/outputs/flutter-apk"
          ls -la "$APK_DIR"
          mapfile -t APKS < <(find "$APK_DIR" -name '*.apk' | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No release APK was produced"
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            echo "=== $apk ==="
            # A release build is AOT compiled: every ABI must ship
            # libapp.so (debug builds carry kernel blob files instead).
            unzip -l "$apk" | grep -E 'lib/[^/]+/libapp\.so' \
              || { echo "::error::$apk is missing libapp.so"; exit 1; }
            echo "libapp.so: OK"
            if [ -d native/third_party/ncnn-android ]; then
              unzip -l "$apk" | grep -E 'lib/[^/]+/librealscale_ncnn\.so' \
                || { echo "::error::$apk is missing librealscale_ncnn.so"; exit 1; }
              echo "librealscale_ncnn.so: OK"
            else
              echo "native ncnn not fetched — APK ships Lanczos fallback only"
            fi
          done

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using $APKSIGNER"
          APK_DIR="build/app/outputs/flutter-apk"
          mapfile -t APKS < <(find "$APK_DIR" -name '*.apk' | sort)
          for apk in "${APKS[@]}"; do
            "$APKSIGNER" verify --print-certs "$apk" \
              || { echo "::error::$apk failed signature verification"; exit 1; }
          done

      - name: Collect release artifacts
        run: |
          mkdir -p release-out
          find build/app/outputs/flutter-apk -name '*.apk' -exec cp {} release-out/ \;
          {
            echo "# RealScale-Pro — release Android APK"
            echo
            echo "App version : $(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2)"
            echo "Flutter     : ${{ env.FLUTTER_VERSION }}"
            echo "Commit      : ${{ github.sha }}"
            echo "Run         : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Install with: adb install -r <file>.apk"
          } > release-out/README-APK.txt
          ls -la release-out

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: realscale-pro-release-apk-${{ github.run_number }}
          path: release-out/
          if-no-files-found: error
          retention-days: 30
