name: ci-smoke

on:
  workflow_dispatch:
    inputs:
      split_per_abi:
        description: 'Also build one smaller APK per CPU architecture'
        type: boolean
        default: true
      include_native_ncnn:
        description: 'Build the native ncnn engine (needs model support)'
        type: boolean
        default: true
  push:
    branches: ['main', 'arena/**']
    paths-ignore: ['**.md', 'docs/**', 'reports/**']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  JAVA_VERSION: '21'
  NCNN_VERSION: '20240410'

jobs:
  hello:
    name: Analyze, format & test
    runs-on: ubuntu-latest
    steps:
      - run: echo "hello from actions"
