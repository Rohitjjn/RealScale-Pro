name: Build APK

on:
  push:
    branches:
      - main
      - master
      - 'arena/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  UPSTREAM_APK_1_13_2_URL: https://github.com/tumuyan/RealSR-NCNN-Android/releases/download/1.13.2/RealSR-NCNN-Android-GUI-armv8a-1.13.2.apk

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMGR=$(find "$ANDROID_HOME" -name sdkmanager | head -n 1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Fetch upstream 1.13.2 prebuilt assets
        run: |
          mkdir -p /tmp/upstream-assets/apk1132
          curl -fL "$UPSTREAM_APK_1_13_2_URL" -o /tmp/upstream-assets/apk-1.13.2.apk
          curl -fL "https://github.com/tumuyan/RealSR-NCNN-Android/releases/download/1.13.0/assets.zip" -o /tmp/upstream-assets/assets-1.13.0.zip
          unzip -q /tmp/upstream-assets/apk-1.13.2.apk 'assets/realsr/*' -d /tmp/upstream-assets/apk1132
          mkdir -p RealSR-NCNN-Android-GUI/app/src/main/assets
          cp -r /tmp/upstream-assets/apk1132/assets/realsr RealSR-NCNN-Android-GUI/app/src/main/assets/

          python3 - << 'PY'
          import zipfile, zlib
          for label, path, pfx in [
              ("1130_zip", "/tmp/upstream-assets/assets-1.13.0.zip", "realsr/"),
              ("1132_apk", "/tmp/upstream-assets/apk-1.13.2.apk", "assets/realsr/"),
          ]:
              zf = zipfile.ZipFile(path)
              bins = [i for i in zf.infolist() if i.filename.startswith(pfx) and not i.is_dir() and "/models" not in i.filename]
              raw = sum(i.file_size for i in bins)
              deflated = sum(len(zlib.compress(zf.read(i.filename), 9)) for i in bins)
              top = sorted(
                  [(i.filename[len(pfx):], i.file_size/1048576, len(zlib.compress(zf.read(i.filename), 9))/1048576) for i in bins],
                  key=lambda x: -x[2]
              )[:12]
              msg = f"{label}: raw={raw/1048576:.2f}MB all_deflated9={deflated/1048576:.2f}MB | " + ", ".join(f"{n}:{c:.2f}M" for n, _, c in top)
              print(msg)
              print(f"::notice title=Size_{label}::{msg}")
          PY

      - name: Run unit tests & assembleDebug
        working-directory: RealSR-NCNN-Android-GUI
        run: |
          set -o pipefail
          chmod +x gradlew
          if ! ./gradlew testDebugUnitTest assembleDebug --stacktrace > /tmp/gradle.log 2>&1; then
            MSG=$(tail -n 90 /tmp/gradle.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=GradleBuildError::${MSG:0:3800}"
            cat /tmp/gradle.log
            exit 1
          fi
          cat /tmp/gradle.log
          echo "::notice title=Step1GoldenTestsPassed::All golden engine command parity tests passed and debug APK built."

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: realscale-pro-apk
          path: RealSR-NCNN-Android-GUI/app/build/outputs/apk/**/*.apk
          retention-days: 14
