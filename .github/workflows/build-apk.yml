name: Build APK

on:
  push:
    branches:
      - main
      - master
      - 'arena/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  UPSTREAM_APK_1_13_2_URL: https://github.com/tumuyan/RealSR-NCNN-Android/releases/download/1.13.2/RealSR-NCNN-Android-GUI-armv8a-1.13.2.apk

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMGR=$(find "$ANDROID_HOME" -name sdkmanager | head -n 1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Fetch upstream 1.13.2 prebuilt assets
        run: |
          mkdir -p /tmp/upstream-assets/apk1132
          curl -fL "$UPSTREAM_APK_1_13_2_URL" -o /tmp/upstream-assets/apk-1.13.2.apk
          unzip -q /tmp/upstream-assets/apk-1.13.2.apk 'assets/realsr/*' -d /tmp/upstream-assets/apk1132
          mkdir -p RealSR-NCNN-Android-GUI/app/src/main/assets
          cp -r /tmp/upstream-assets/apk1132/assets/realsr RealSR-NCNN-Android-GUI/app/src/main/assets/

          # Measure solid tar.xz compression of non-model ELF binaries
          python3 - << 'PY'
          import os, shutil, subprocess
          src = "RealSR-NCNN-Android-GUI/app/src/main/assets/realsr"
          tmp = "/tmp/solid-test"
          os.makedirs(tmp, exist_ok=True)
          for f in os.listdir(src):
              p = os.path.join(src, f)
              if os.path.isfile(p) and not f.endswith(".xml"):
                  shutil.copy2(p, os.path.join(tmp, f))
          subprocess.run(["tar", "-cf", "/tmp/binaries.tar", "-C", tmp, "."], check=True)
          subprocess.run(["xz", "-f", "--arm64", "--lzma2=dict=16MiB,preset=9e", "/tmp/binaries.tar"], check=True)
          sz = os.path.getsize("/tmp/binaries.tar.xz") / 1048576
          print(f"::notice title=SolidTarXzSize::binaries.tar.xz = {sz:.2f} MiB (all 8 CLI tools + all .so libs)")
          PY

      - name: Run unit tests & assembleDebug
        working-directory: RealSR-NCNN-Android-GUI
        run: |
          set -o pipefail
          chmod +x gradlew
          if ! ./gradlew testDebugUnitTest assembleDebug --stacktrace > /tmp/gradle.log 2>&1; then
            MSG=$(tail -n 90 /tmp/gradle.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=GradleBuildError::${MSG:0:3800}"
            cat /tmp/gradle.log
            exit 1
          fi
          cat /tmp/gradle.log
          echo "::notice title=Step1GoldenTestsPassed::All golden engine command parity tests passed and debug APK built."

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: realscale-pro-apk
          path: RealSR-NCNN-Android-GUI/app/build/outputs/apk/**/*.apk
          retention-days: 14
