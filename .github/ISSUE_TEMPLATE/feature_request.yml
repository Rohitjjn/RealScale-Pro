name: Feature Request
description: Propose a new workflow, control, localization, or UX improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the real-world scenario where RealScale-Pro falls short today.
      placeholder: "When upscaling 20 scanned family photos, I want to apply the same custom tile size and format to the entire folder..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Explain how you would expect this to work inside the app.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Alternatives or Examples (Optional)
      description: Mention any workarounds, mockups, or open-source apps that handle this well.

  - type: checkboxes
    id: scope
    attributes:
      label: Project Principles Check
      options:
        - label: This feature works on-device without requiring cloud uploads, accounts, or analytics.
          required: true
