<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="RealScale-Pro: an offline, on-device AI image upscaler. Mobile app UI in a warm cream and coral theme."
    />
    <title>RealScale-Pro · Image Upscaler</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c75b18'/%3E%3Cpath d='M23.6 8.2A9.5 9.5 0 1 0 25 19' fill='none' stroke='%23ffffff' stroke-width='3.2' stroke-linecap='round'/%3E%3Cpath d='M8.4 23.8A9.5 9.5 0 0 1 7 13' fill='none' stroke='%23141413' stroke-width='3.2' stroke-linecap='round'/%3E%3Ccircle cx='19.5' cy='14.5' r='1.7' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <style>
      html { background: #e8e0d2; }
      html[data-theme="dark"] { background: #2b2926; }
    </style>
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('realscale-pro:v1') || '{}');
        var theme = (saved.settings && saved.settings.theme) || 'light';
        if (theme === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
